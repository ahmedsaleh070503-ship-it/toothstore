<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tooth Store | المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#F2F8F7;--sand:#D3E5E2;--tile:#E4F2F0;--caramel:#169A91;--brown:#4B6865;--espresso:#12302F;--charcoal:#1B2B2A;--white:#FFFFFF;--rust:#E4693F;--gum:#E9959A;--ok:#1B7F4B;--err:#C0392B}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--charcoal);overflow-x:hidden;padding-top:70px}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.tw{fill:#fff;stroke:#8fa9a6;stroke-width:.6}.tg{fill:#E0B84A;stroke:#A9842A;stroke-width:.6}.gm{fill:var(--gum)}
nav{position:fixed;top:0;width:100%;z-index:200;background:rgba(242,248,247,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--sand);padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:70px;transition:box-shadow .3s}
nav.scrolled{box-shadow:0 4px 30px rgba(18,48,47,.12)}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.logo-mark{height:42px;width:42px;border-radius:50%;background:var(--caramel);display:grid;place-items:center;flex:none}
.logo-mark svg{width:24px;height:24px;fill:#fff}
.nav-logo-text{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--espresso);letter-spacing:1px;white-space:nowrap}
.nav-logo-text span{color:var(--caramel)}
.nav-links{display:flex;gap:2.2rem;list-style:none}
.nav-links a{font-size:.95rem;font-weight:500;color:var(--brown);text-decoration:none;position:relative;padding-bottom:4px;transition:color .3s}
.nav-links a::after{content:'';position:absolute;bottom:0;inset-inline-start:0;width:0;height:2px;background:var(--caramel);transition:width .3s}
.nav-links a:hover,.nav-links a.active{color:var(--espresso)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-right{display:flex;align-items:center;gap:1rem}
.cart-btn{background:var(--espresso);color:var(--cream);border:none;border-radius:50px;padding:.55rem 1.3rem;font-size:.9rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:background .3s}
.cart-btn:hover{background:var(--brown)}
.cart-count{background:var(--caramel);color:#fff;border-radius:50px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.78rem;padding:0 6px}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;z-index:300}
.hamburger span{display:block;width:26px;height:2.5px;background:var(--espresso);border-radius:4px;transition:all .35s;transform-origin:center}
.hamburger.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.mobile-drawer{display:none;position:fixed;top:70px;right:0;left:0;background:var(--white);border-bottom:2px solid var(--sand);padding:1.5rem 5%;flex-direction:column;gap:1.2rem;z-index:199;transform:translateY(-110%);transition:transform .35s;box-shadow:0 8px 30px rgba(18,48,47,.1)}
.mobile-drawer.open{transform:translateY(0)}
.mobile-drawer a{font-size:1.1rem;font-weight:600;color:var(--espresso);text-decoration:none;padding:.6rem 0;border-bottom:1px solid var(--sand)}
.mobile-drawer a:last-child{border-bottom:none}
.mobile-drawer a.active{color:var(--caramel)}
@media(max-width:768px){.nav-links{display:none}.hamburger{display:flex}.mobile-drawer{display:flex}.nav-logo-text{font-size:1.25rem}}
.hero{min-height:calc(100vh - 70px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;padding:40px 5% 60px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(22,154,145,.18) 0%,transparent 55%),radial-gradient(ellipse at 10% 80%,rgba(233,149,154,.14) 0%,transparent 50%);z-index:0}
.hero-text,.hero-visual{position:relative;z-index:1;min-width:0}
.hero-badge{display:inline-block;background:var(--caramel);color:#fff;font-size:.78rem;font-weight:700;letter-spacing:2px;padding:.4rem 1.2rem;border-radius:50px;margin-bottom:1.8rem}
.hero-title{font-family:'Playfair Display','Tajawal',serif;font-size:clamp(2.2rem,5vw,4.2rem);font-weight:900;line-height:1.2;color:var(--espresso);margin-bottom:1.4rem;text-wrap:balance}
.hero-title em{color:var(--caramel);font-style:italic}
.hero-desc{font-size:1.05rem;color:var(--brown);line-height:1.8;max-width:440px;margin-bottom:2.2rem}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
.btn-primary{background:var(--espresso);color:var(--cream);padding:.85rem 2.2rem;border-radius:50px;font-size:1rem;font-weight:700;text-decoration:none;border:2px solid var(--espresso);transition:all .3s;display:inline-flex;align-items:center;gap:.5rem;cursor:pointer}
.btn-primary:hover{background:transparent;color:var(--espresso)}
.btn-outline{background:transparent;color:var(--brown);padding:.85rem 2.2rem;border-radius:50px;font-size:1rem;font-weight:700;text-decoration:none;border:2px solid var(--sand);transition:all .3s}
.btn-outline:hover{border-color:var(--caramel);color:var(--caramel)}
.hero-visual{display:flex;justify-content:center}
.hero-card{background:var(--white);border-radius:24px;padding:3rem 2.5rem 2.2rem;box-shadow:0 30px 80px rgba(18,48,47,.15);width:100%;max-width:360px;text-align:center;position:relative}
.hero-card-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--rust);color:#fff;font-size:.75rem;font-weight:700;padding:.3rem 1rem;border-radius:50px;white-space:nowrap}
.hero-art{width:170px;max-width:100%;margin:0 auto 1rem;display:block;background:var(--tile);border-radius:20px;padding:12px}
.hero-card h3{font-family:'Playfair Display','Tajawal',serif;font-size:1.4rem;color:var(--espresso);margin-bottom:.5rem}
.hero-card p{font-size:.9rem;color:var(--brown)}
.hero-stats{display:flex;gap:1.2rem;margin-top:1.6rem;justify-content:center}
.stat-num{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--espresso);display:block}
.stat-label{font-size:.8rem;color:var(--brown)}
.marquee-wrap{background:var(--espresso);padding:1rem 0;overflow:hidden;white-space:nowrap}
.marquee-inner{display:inline-block;animation:marquee 30s linear infinite}
.marquee-inner span{color:var(--sand);font-size:.85rem;font-weight:500;letter-spacing:2px;margin:0 2rem}
.marquee-inner span.dot{color:var(--caramel);margin:0 .5rem}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media(prefers-reduced-motion:reduce){.marquee-inner{animation:none}}
.features{padding:4rem 5%;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem}
.feature-card{background:var(--white);border-radius:20px;padding:2.2rem 1.8rem;text-align:center;transition:transform .3s,box-shadow .3s;border:1px solid var(--sand)}
.feature-card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(18,48,47,.1)}
.feature-icon{font-size:2.4rem;margin-bottom:1rem;display:block}
.feature-card h3{font-family:'Playfair Display','Tajawal',serif;font-size:1.2rem;color:var(--espresso);margin-bottom:.6rem}
.feature-card p{font-size:.9rem;color:var(--brown);line-height:1.7}
.section-header{text-align:center;padding:3rem 5% 1.5rem}
.section-tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:3px;color:var(--caramel);margin-bottom:.8rem}
.section-title{font-family:'Playfair Display','Tajawal',serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:var(--espresso);line-height:1.3}
.section-title em{color:var(--caramel);font-style:italic}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2rem;padding:1rem 5% 3rem}
.tile{text-decoration:none;color:var(--espresso);display:flex;flex-direction:column;gap:.5rem;min-width:0}
.tile .art{display:block;aspect-ratio:1/1;background:var(--tile);border-radius:18px;border:1px solid var(--sand);padding:10%;transition:transform .3s,box-shadow .3s}
.tile:hover .art{transform:translateY(-6px);box-shadow:0 18px 40px rgba(18,48,47,.12);border-color:var(--caramel)}
.tile svg{display:block;width:100%;height:100%}
.tile .tn{font-weight:700;font-size:.95rem;line-height:1.4;direction:ltr;text-align:right}
.tile .ta{color:var(--brown);font-size:.82rem}
.products-grid{padding:1rem 5% 4rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.8rem}
.product-card{background:var(--white);border-radius:20px;overflow:hidden;border:1px solid var(--sand);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;min-width:0}
.product-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(18,48,47,.12)}
.product-img{aspect-ratio:4/3;background:var(--tile);display:flex;align-items:center;justify-content:center;position:relative;padding:8%}
.product-img svg{height:100%;width:auto;max-width:100%}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.product-badge{position:absolute;top:12px;right:12px;background:var(--rust);color:#fff;font-size:.7rem;font-weight:700;padding:.25rem .7rem;border-radius:50px;z-index:1}
.product-info{padding:1.3rem 1.4rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.product-category{font-size:.75rem;color:var(--caramel);font-weight:700;letter-spacing:1px;direction:ltr;text-align:right}
.product-name{font-family:'Playfair Display','Tajawal',serif;font-size:1.1rem;color:var(--espresso)}
.product-desc{font-size:.85rem;color:var(--brown);line-height:1.6}
.specs{display:flex;flex-direction:column}
.spec{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--sand);font-size:.95rem}
.spec span{color:var(--brown)}.spec b{color:var(--espresso)}
.spec b.q-low{color:#8A5200}.spec b.q-out{color:var(--err)}
.stock{align-self:flex-start;font-size:.78rem;font-weight:700;padding:.2rem .7rem;border-radius:50px}
.stock.ok{background:#DDF2E6;color:var(--ok)}.stock.low{background:#FFEFD2;color:#8A5200}.stock.out{background:#F7D9D4;color:var(--err)}
.product-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.6rem}
.product-price{font-size:1.2rem;font-weight:700;color:var(--caramel)}
.product-price span{font-size:.8rem;font-weight:400;color:var(--brown)}
.btn-add{background:var(--espresso);color:var(--cream);border:none;border-radius:50px;padding:.55rem 1.2rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .3s,transform .2s}
.btn-add:hover{background:var(--brown);transform:scale(1.05)}
.btn-add:disabled{opacity:.5;cursor:not-allowed;transform:none}
.view-all-wrap{text-align:center;padding-bottom:3.5rem}
.page-hero{background:var(--espresso);color:var(--cream);text-align:center;padding:3rem 5%}
.page-hero h1{font-family:'Playfair Display','Tajawal',serif;font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:.5rem}
.page-hero p{color:var(--sand)}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:1.5rem 5% 0}
.filter-label{font-weight:700;color:var(--brown);margin-inline-end:.4rem}
.filter-btn{background:var(--white);border:1px solid var(--sand);color:var(--brown);border-radius:50px;padding:.45rem 1.1rem;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:var(--caramel);color:var(--caramel)}
.filter-btn.active{background:var(--caramel);border-color:var(--caramel);color:#fff}
.empty-note{grid-column:1/-1;text-align:center;color:var(--brown);padding:3rem 0}
.cart-overlay{position:fixed;inset:0;background:rgba(18,48,47,.5);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:auto}
.cart-sidebar{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:var(--white);z-index:401;transform:translateX(-100%);transition:transform .35s;display:flex;flex-direction:column}
.cart-sidebar.open{transform:translateX(0)}
.cart-header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.3rem;border-bottom:1px solid var(--sand)}
.cart-header h2{font-family:'Playfair Display','Tajawal',serif;font-size:1.2rem;color:var(--espresso)}
.close-cart{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--espresso)}
.cart-items{flex:1;overflow:auto;padding:.5rem 1.3rem}
.cart-empty{text-align:center;color:var(--brown);padding:3rem 0}
.cart-empty span{display:block;font-size:2.4rem;margin-bottom:.5rem}
.cart-item{display:flex;gap:.8rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--sand)}
.cart-thumb{width:56px;height:56px;border-radius:10px;background:var(--tile);flex:none;position:relative;overflow:hidden;padding:4px}
.cart-thumb svg{width:100%;height:100%}.cart-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0;font-size:.9rem;line-height:1.4}
.ci-info b{display:block;color:var(--espresso)}
.ci-price{color:var(--caramel);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--sand);border-radius:50px;overflow:hidden}
.qty button{background:none;border:0;width:30px;height:32px;font-size:1.1rem;cursor:pointer;color:var(--espresso)}
.qty output{min-width:24px;text-align:center;font-weight:700;font-size:.9rem}
.ci-rm{background:none;border:0;color:var(--brown);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:0;margin-top:2px}
.cart-footer{border-top:1px solid var(--sand);padding:1rem 1.3rem;max-height:62vh;overflow:auto}
.cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;color:var(--espresso);margin-bottom:.8rem}
.btn-proceed,.btn-checkout{width:100%;border:none;border-radius:50px;padding:.8rem;font-size:1rem;font-weight:700;cursor:pointer;color:#fff}
.btn-proceed{background:var(--espresso)}
.btn-checkout{background:#25D366;margin-top:.4rem}
.order-form{display:none;flex-direction:column;gap:.7rem}
.order-form.open{display:flex}
.fg{display:flex;flex-direction:column;gap:3px}
.fg input,.fg select,.fg textarea,.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--sand);border-radius:12px;padding:.7rem .9rem;font-size:.95rem;background:var(--cream);color:var(--charcoal)}
.fg textarea,.form-group textarea{min-height:76px;resize:vertical}
.fg.bad input,.fg.bad select,.fg.bad textarea,.form-group.bad input,.form-group.bad textarea{border-color:var(--err)}
.err{color:var(--err);font-size:.78rem}
.pay-note{background:var(--tile);border:1px solid var(--sand);border-radius:12px;padding:.7rem .9rem;font-size:.88rem;line-height:1.7;color:var(--espresso)}

a.product-card{text-decoration:none;color:inherit}
.btn-view{background:var(--espresso);color:var(--cream);border-radius:50px;padding:.5rem 1.1rem;font-size:.85rem;font-weight:700}
.ci-sub{font-size:.78rem;color:var(--brown)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;padding:2rem 5% 4rem;align-items:start}
.pd>*{min-width:0}
.g-main{display:block;width:100%;aspect-ratio:1/1;background:var(--tile);border:1px solid var(--sand);border-radius:20px;position:relative;overflow:hidden;padding:12%;cursor:zoom-in}
.g-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g-main svg{width:100%;height:100%}
.g-count{position:absolute;bottom:10px;left:12px;background:rgba(18,48,47,.75);color:#fff;font-size:.78rem;padding:.15rem .6rem;border-radius:50px;direction:ltr}
.g-thumbs{display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap}
.g-thumb{width:68px;height:68px;border:2px solid var(--sand);border-radius:12px;overflow:hidden;padding:0;background:var(--tile);cursor:pointer}
.g-thumb.sel{border-color:var(--caramel)}
.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pd-info{display:flex;flex-direction:column;gap:1.1rem}
.pd-title{font-family:'Playfair Display','Tajawal',serif;font-size:clamp(1.6rem,3.5vw,2.2rem);color:var(--espresso);line-height:1.3}
.pd-price{font-size:1.6rem;font-weight:800;color:var(--caramel)}
.pd-price small{font-size:.85rem;font-weight:400;color:var(--brown)}
.opt-t{font-weight:700;color:var(--espresso);margin-bottom:.5rem}
.opt-v{display:flex;flex-wrap:wrap;gap:.5rem}
.opt-btn{background:var(--white);border:1.5px solid var(--sand);color:var(--espresso);border-radius:50px;padding:.5rem 1.1rem;font-size:.92rem;font-weight:600;cursor:pointer;transition:all .15s}
.opt-btn:hover:not(:disabled){border-color:var(--caramel)}
.opt-btn.sel{background:var(--espresso);border-color:var(--espresso);color:var(--cream)}
.opt-btn:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.qty-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.qty-row small{color:var(--brown)}
.pd-actions{display:flex;gap:.8rem;flex-wrap:wrap}
.pd-add{flex:1;min-width:180px;background:var(--caramel);color:#fff;border:0;border-radius:50px;padding:.9rem 1.5rem;font-size:1.05rem;font-weight:800;cursor:pointer}
.pd-add:disabled{opacity:.5;cursor:not-allowed}
.btn-share{background:var(--white);border:1.5px solid var(--sand);color:var(--espresso);border-radius:50px;padding:.9rem 1.4rem;font-weight:700;cursor:pointer}
.zoom{position:fixed;inset:0;background:rgba(18,48,47,.85);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.zoom .z-in{background:var(--tile);border-radius:20px;width:min(560px,100%);aspect-ratio:1/1;padding:8%;position:relative;overflow:hidden}
.zoom .z-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.zoom .z-in svg{width:100%;height:100%}
@media(max-width:800px){.pd{grid-template-columns:1fr;gap:1.5rem}}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--espresso);color:var(--cream);padding:.7rem 1.4rem;border-radius:50px;z-index:1000;font-weight:600;font-size:.9rem;max-width:90vw;text-align:center}
.whatsapp-float{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:24px;z-index:300;background:#25D366;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;text-decoration:none;box-shadow:0 8px 25px rgba(37,211,102,.45);transition:transform .3s}
.whatsapp-float:hover{transform:scale(1.1)}
footer{background:var(--espresso);color:var(--sand);padding:3rem 5% 1.5rem}
.footer-top{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem;margin-bottom:2rem}
.footer-brand p{font-size:.9rem;color:#8FB0AC;margin-top:1rem;line-height:1.8}
.footer-col h4{font-family:'Playfair Display','Tajawal',serif;font-size:1rem;color:var(--cream);margin-bottom:1rem}
.footer-col ul{list-style:none}.footer-col li{margin-bottom:.6rem}
.footer-col a{color:#8FB0AC;font-size:.9rem;text-decoration:none}.footer-col a:hover{color:var(--caramel)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:1.2rem;font-size:.85rem;color:#7FA19D;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.footer-bottom a{color:inherit}
.contact-wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:2rem;padding:3rem 5%}
.contact-info{display:flex;flex-direction:column;gap:1rem;min-width:0}
.whatsapp-card{background:#25D366;color:#fff;border-radius:20px;padding:1.6rem;text-decoration:none;display:block}
.whatsapp-card span{font-size:2rem;display:block}
.whatsapp-card h3{margin:.3rem 0}
.info-card{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:1.1rem 1.3rem;display:flex;gap:1rem;align-items:center}
.info-icon{font-size:1.6rem}
.info-content h3{color:var(--espresso);font-size:1rem;margin-bottom:.2rem}
.info-content p,.info-content a{color:var(--brown);font-size:.92rem;line-height:1.6}
.contact-form-wrap{background:var(--white);border:1px solid var(--sand);border-radius:20px;padding:1.8rem;min-width:0}
.form-header h2{font-family:'Playfair Display','Tajawal',serif;color:var(--espresso);margin-bottom:.3rem}
.form-header p{color:var(--brown);font-size:.9rem;margin-bottom:1.2rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
.form-group label{font-weight:700;font-size:.88rem;color:var(--espresso)}
.submit-btn{width:100%;background:#25D366;color:#fff;border:0;border-radius:50px;padding:.9rem;font-size:1rem;font-weight:700;cursor:pointer}
.faq-section{padding:1rem 5% 4rem;max-width:820px;margin:0 auto}
.faq-title{font-family:'Playfair Display','Tajawal',serif;color:var(--espresso);text-align:center;margin-bottom:1.2rem}
.faq-item{background:var(--white);border:1px solid var(--sand);border-radius:14px;margin-bottom:.7rem;overflow:hidden}
.faq-q{padding:1rem 1.2rem;font-weight:700;color:var(--espresso);cursor:pointer;display:flex;justify-content:space-between;gap:1rem}
.faq-a{display:none;padding:0 1.2rem 1rem;color:var(--brown);line-height:1.8}
.faq-item.open .faq-a{display:block}

@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.hero-card{padding:2.4rem 1.4rem 1.6rem}}

.hero{grid-template-columns:1fr;text-align:center;min-height:calc(100vh - 140px);justify-items:center}
.hero-desc{margin:0 auto 2.2rem}
.hero-btns{justify-content:center}
.lang-btn{background:transparent;color:var(--espresso);border:1.5px solid var(--sand);border-radius:50px;padding:.45rem .9rem;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.lang-btn:hover{border-color:var(--caramel);color:var(--caramel)}
@media(max-width:480px){.nav-right{gap:.5rem}.cart-btn{padding:.5rem .8rem}.hero{grid-template-columns:1fr;text-align:center;min-height:calc(100vh - 140px);justify-items:center}

.hero-btns{justify-content:center}
.lang-btn{padding:.4rem .7rem}}

function vstock(p,sel){return (p.out||[]).indexOf(vals(p,sel).join('|'))>-1?0:p.stock;}
var cart={};
try{var raw=JSON.parse(localStorage.getItem('tooth-cart2')||'{}');cart=(raw&&typeof raw==='object')?raw:{};}catch(e){cart={};}
function saveCart(){try{localStorage.setItem('tooth-cart2',JSON.stringify(cart));}catch(e){}}
function cartCount(){var c=0;for(var k in cart)c+=cart[k].qty;return c;}
function cartTotal(){var t0=0;for(var k in cart){var p=find(cart[k].id);if(!p)continue;if(p.price==null)return null;t0+=p.price*cart[k].qty;}return t0;}
function totalText(){var x=cartTotal();return x==null?'?':money(x);}
var toastTimer;
function toast(m){var el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);}el.textContent=m;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true;},2000);}
function addVariant(id,sel,n){
  var p=find(id),key=vkey(p,sel),max=vstock(p,sel),cur=cart[key]?cart[key].qty:0;
  if(max<=0){toast(t('t_soldout'));return false;}
  if(cur+n>max){toast(t('t_only').replace('%n',max));return false;}
  cart[key]={id:id,sel:JSON.parse(JSON.stringify(sel)),qty:cur+n};saveCart();updateCart();toast(t('t_added'));return true;
}
function changeQtyAt(i,d){var key=Object.keys(cart)[i],it=cart[key];if(!it)return;var p=find(it.id),max=vstock(p,it.sel),q=it.qty+d;if(q>max)q=max;if(q<=0)delete cart[key];else it.qty=q;saveCart();updateCart();}
function removeAt(i){delete cart[Object.keys(cart)[i]];saveCart();updateCart();}
function updateCart(){
  var el=document.getElementById('cartCount');if(el)el.textContent=cartCount();
  var box=document.getElementById('cartItems'),keys=Object.keys(cart),h='';
  if(!keys.length)h='<div class="cart-empty"><span>🛒</span>'+t('k_empty')+'</div>';
  keys.forEach(function(k,i){var it=cart[k],p=find(it.id);if(!p)return;h+='<div class="cart-item"><div class="cart-thumb">'+pic(p)+'</div><div class="ci-info"><b>'+esc(pick(p.name))+'</b><span class="ci-sub">'+esc(vname(p,it.sel))+'</span><br><span class="ci-price">'+(p.price==null?'?':money(p.price))+'</span> <button class="ci-rm" onclick="removeAt('+i+')">'+t('k_remove')+'</button></div><div class="qty"><button onclick="changeQtyAt('+i+',1)" aria-label="+">+</button><output>'+it.qty+'</output><button onclick="changeQtyAt('+i+',-1)" aria-label="-">−</button></div></div>';});
  box.innerHTML=h;
  document.getElementById('cartTotal').textContent=totalText();
  document.getElementById('cartFooter').hidden=!keys.length;
}
function openCart(){document.getElementById('cartOverlay').classList.add('open');document.getElementById('cartSidebar').classList.add('open');}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartSidebar').classList.remove('open');}
function showOrderForm(){document.getElementById('orderForm').classList.add('open');document.getElementById('proceedBtn').hidden=true;}
function digits(s){return s.replace(/\D/g,'').length;}
function setErr(id,key){var f=document.getElementById('g-'+id);f.classList.toggle('bad',!!key);document.getElementById('e-'+id).textContent=key?t(key):'';f.setAttribute('data-err',key||'');return !key;}
function openWA(msg){var url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);var w=window.open(url,'_blank');if(!w){location.href=url;}}
function v(id){return document.getElementById(id).value.trim();}
function sendOrder(){
  var ok=true;
  ok=setErr('cName',v('cName').length<2?'e_name':'')&&ok;
  ok=setErr('cPhone',digits(v('cPhone'))<10?'e_phone':'')&&ok;
  ok=setErr('cPhone2',(v('cPhone2')&&digits(v('cPhone2'))<10)?'e_phone2':'')&&ok;
  ok=setErr('cAddr',v('cAddr').length<8?'e_addr':'')&&ok;
  if(!Object.keys(cart).length){toast(t('t_empty'));return;}
  if(!ok){toast(t('t_check'));return;}
  var l=['🦷 *طلب جديد من Tooth Store*','','👤 *الاسم:* '+v('cName'),'📱 *الموبايل:* '+v('cPhone')];
  if(v('cPhone2'))l.push('📞 *رقم بديل:* '+v('cPhone2'));
  l.push('📍 *العنوان:* '+v('cAddr'),'💳 *الدفع:* انستا باي','','🛒 *المنتجات:*');
  var tot=cartTotal();
  Object.keys(cart).forEach(function(k){var it=cart[k],p=find(it.id);if(p)l.push('• '+p.name[0]+' ('+vname(p,it.sel,true)+') × '+it.qty+(p.price==null?'':' = '+(p.price*it.qty)+' جنيه'));});
  if(tot!=null)l.push('','💰 *الإجمالي:* '+tot+' جنيه');
  if(v('cNotes'))l.push('','📝 *ملاحظات:* '+v('cNotes'));
  openWA(l.join('\n'));
}
function toggleMenu(){document.getElementById('hamburger').classList.toggle('open');document.getElementById('mobileDrawer').classList.toggle('open');}
function fld(id,inner){return '<div class="fg" id="g-'+id+'">'+inner+'<span class="err" id="e-'+id+'"></span></div>';}
document.body.insertAdjacentHTML('beforeend',
 '<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div><aside class="cart-sidebar" id="cartSidebar"><div class="cart-header"><h2 data-i="k_title"></h2><button class="close-cart" onclick="closeCart()" aria-label="X">✕</button></div><div class="cart-items" id="cartItems"></div><div class="cart-footer" id="cartFooter" hidden><div class="cart-total"><span data-i="k_total"></span><span id="cartTotal">?</span></div><div id="proceedBtn"><button class="btn-proceed" onclick="showOrderForm()" data-i="k_next"></button></div><div class="order-form" id="orderForm">'
 +fld('cName','<input type="text" id="cName" data-ph="k_name">')
 +fld('cPhone','<input type="tel" id="cPhone" data-ph="k_phone">')
 +fld('cPhone2','<input type="tel" id="cPhone2" data-ph="k_phone2">')
 +fld('cAddr','<textarea id="cAddr" data-ph="k_addr"></textarea>')
 +'<div class="pay-note" id="payNote"></div>'
 +fld('cNotes','<textarea id="cNotes" data-ph="k_notes"></textarea>')
 +'<button class="btn-checkout" onclick="sendOrder()" data-i="k_send"></button></div></div></aside>');
window.addEventListener('scroll',function(){document.getElementById('navbar').classList.toggle('scrolled',window.scrollY>20);});
document.querySelectorAll('.mobile-drawer a').forEach(function(a){a.addEventListener('click',function(){document.getElementById('hamburger').classList.remove('open');document.getElementById('mobileDrawer').classList.remove('open');});});
function applyLang(){
  var de=document.documentElement;de.lang=L;de.dir=(L==='en'?'ltr':'rtl');
  document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=t(e.getAttribute('data-i'));});
  document.querySelectorAll('[data-ph]').forEach(function(e){e.placeholder=t(e.getAttribute('data-ph'));});
  document.querySelectorAll('.fg,.form-group').forEach(function(g){var k=g.getAttribute('data-err');if(k){var s=g.querySelector('.err');if(s)s.textContent=t(k);}});
  var lb=document.getElementById('langBtn');if(lb){lb.textContent=L==='en'?'عربي':'EN';lb.setAttribute('aria-label',L==='en'?'التبديل إلى العربية':'Switch to English');}
  var pn=document.getElementById('payNote');if(pn)pn.innerHTML=t('k_pay1')+(INSTAPAY?'<br>'+t('k_pay2')+' <b dir="ltr">'+esc(INSTAPAY)+'</b>':'')+'<br>'+t('k_pay3');
  updateCart();
  if(window.onLang)window.onLang();
}
function toggleLang(){L=(L==='ar')?'en':'ar';try{localStorage.setItem('tooth-lang',L);}catch(e){}applyLang();}

var P=PRODUCTS[0];
var sel={},qty=1,gi=0;
P.options.forEach(function(o){sel[o.key]=o.values[0][0];});
function test(o,val){var s2=JSON.parse(JSON.stringify(sel));s2[o.key]=val;return vstock(P,s2)>0;}
function openZoom(){var im=(P.imgs||[])[gi];document.getElementById('zoomIn').innerHTML=im?'<img src="'+esc(im)+'" alt="">':art(P.art||'operative');document.getElementById('zoom').hidden=false;}
function closeZoom(){document.getElementById('zoom').hidden=true;}
function render(){
  var imgs=P.imgs||[],st=vstock(P,sel),key=vkey(P,sel),inCart=cart[key]?cart[key].qty:0,left=Math.max(st-inCart,0);
  if(qty>left)qty=Math.max(left,1);
  var g='<div><button class="g-main" onclick="openZoom()" aria-label="Zoom">'+(imgs.length?'<img src="'+esc(imgs[gi])+'" alt="'+esc(pick(P.name))+'">':art(P.art||'operative'))+(imgs.length>1?'<span class="g-count">'+(gi+1)+' / '+imgs.length+'</span>':'')+'</button>';
  if(imgs.length>1){g+='<div class="g-thumbs">'+imgs.map(function(u,i){return '<button class="g-thumb'+(i===gi?' sel':'')+'" data-g="'+i+'"><img src="'+esc(u)+'" alt=""></button>';}).join('')+'</div>';}
  g+='</div>';
  var h='<div class="pd-info"><h1 class="pd-title">'+esc(pick(P.name))+'</h1><div class="pd-price">'+priceOf(P)+' <small>'+t('p_per')+'</small></div>';
  h+=st<=0?'<span class="stock out">'+t('t_soldout')+'</span>':'<span class="stock '+(st<=6?'low':'ok')+'">'+(st<=6?'⚠️ ':'✅ ')+t('p_avail')+' '+st+'</span>';
  P.options.forEach(function(o){
    h+='<div class="opt"><div class="opt-t">'+esc(pick(o.label))+'</div><div class="opt-v">'+o.values.map(function(x){return '<button class="opt-btn'+(sel[o.key]===x[0]?' sel':'')+'" data-k="'+esc(o.key)+'" data-v="'+esc(x[0])+'"'+(test(o,x[0])?'':' disabled')+'>'+esc(pick(x))+'</button>';}).join('')+'</div></div>';
  });
  h+='<div class="opt"><div class="opt-t">'+t('p_qty')+'</div><div class="qty-row"><div class="qty"><button data-q="1" aria-label="+">+</button><output>'+qty+'</output><button data-q="-1" aria-label="-">−</button></div><small>('+t('p_incart').replace('%n',inCart)+')</small></div></div>';
  h+='<div class="pd-actions"><button class="pd-add" data-add="1"'+(left<=0?' disabled':'')+'>'+(st<=0?t('t_soldout'):t('p_add'))+'</button><button class="btn-share" data-share="1">'+t('p_share')+'</button></div></div>';
  document.getElementById('pd').innerHTML=g+h;
}
window.onLang=render;
document.getElementById('pd').addEventListener('click',function(e){
  var el=e.target.closest('button');if(!el||el.disabled)return;
  if(el.hasAttribute('data-k')){sel[el.getAttribute('data-k')]=el.getAttribute('data-v');qty=1;render();}
  else if(el.hasAttribute('data-g')){gi=parseInt(el.getAttribute('data-g'),10);render();}
  else if(el.hasAttribute('data-q')){var left=vstock(P,sel)-(cart[vkey(P,sel)]?cart[vkey(P,sel)].qty:0);var n=qty+parseInt(el.getAttribute('data-q'),10);if(n<1)n=1;if(n>left){n=Math.max(left,1);toast(t('t_only').replace('%n',left));}qty=n;render();}
  else if(el.hasAttribute('data-add')){if(addVariant(P.id,sel,qty)){qty=1;}render();}
  else if(el.hasAttribute('data-share')){
    var u=location.href;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast(t('t_copied'));},function(){toast(t('t_copyfail'));});
  }
});
render();

applyLang();</script>
</body>
